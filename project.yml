name: Immerse
options:
  bundleIdPrefix: com.debugzhao
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # SE-0418: KeyPath literals are inferred as Sendable; otherwise SwiftData's #Predicate / SortDescriptor warn under strict concurrency checking
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  # Models, data, stores and pure logic shared with the iOS app
  ImmerseKit:
    path: ImmerseKit

targets:
  Immerse:
    type: application
    platform: macOS
    sources:
      - Immerse
    dependencies:
      - package: ImmerseKit
        product: ImmerseCore
      - package: ImmerseKit
        product: ImmerseAgent
    info:
      path: Immerse/Resources/Info.plist
      properties:
        # The .app file name and Info.plist name stay "Immerse"; the localized name 「沉浸日程」 comes from *.lproj/InfoPlist.strings
        CFBundleDisplayName: Immerse
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: "0.1.10"
        CFBundleVersion: "11"
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 debugzhao"
    entitlements:
      path: Immerse/Resources/Immerse.entitlements
      properties:
        # Needs to call /usr/bin/shortcuts to toggle Do Not Disturb, so the sandbox can't be enabled
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse
        PRODUCT_NAME: Immerse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # The test bundle is injected into the host app; disable Hardened Runtime in Debug to avoid library validation blocking it
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  ImmerseiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ImmerseiOS
      - ImmerseShared
    dependencies:
      - package: ImmerseKit
        product: ImmerseCore
      - package: ImmerseKit
        product: ImmerseAgent
      - target: ImmerseWidgets
    entitlements:
      path: ImmerseiOS/Resources/ImmerseiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.debugzhao.immerse
    info:
      path: ImmerseiOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: 沉浸日程
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Keep the pre-iOS 26 control styling until Liquid Glass is designed for (see docs/ios-agent-design.md)
        UIDesignRequiresCompatibility: true
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: 读取系统日历里的会议，秘书排期时会避开它们。沉浸日程不会修改你的系统日历。
        NSMicrophoneUsageDescription: 按住麦克风说话，把你说的一句话记成待办。
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字，用来快速记录待办。支持的设备上会在本机完成识别。
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.debugzhao.immerse.refresh
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse
        PRODUCT_NAME: ImmerseiOS
        TARGETED_DEVICE_FAMILY: "1"
        # Shared intents act through AppModel inside the app and through the App Group store in the widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) IMMERSE_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Simulator builds need no signing; set DEVELOPMENT_TEAM and switch to Automatic for devices / TestFlight
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""

  ImmerseWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ImmerseWidgets
      - ImmerseShared
    dependencies:
      - package: ImmerseKit
        product: ImmerseCore
    entitlements:
      path: ImmerseWidgets/ImmerseWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.debugzhao.immerse
    info:
      path: ImmerseWidgets/Info.plist
      properties:
        CFBundleDisplayName: 沉浸日程
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""

  ImmerseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ImmerseTests
    dependencies:
      - target: Immerse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse.tests

schemes:
  Immerse:
    build:
      targets:
        Immerse: all
        ImmerseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImmerseTests

  ImmerseiOS:
    build:
      targets:
        ImmerseiOS: all
    run:
      config: Debug
