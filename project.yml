name: Immerse
options:
  bundleIdPrefix: com.debugzhao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # SE-0418: KeyPath literals are inferred as Sendable; otherwise SwiftData's #Predicate / SortDescriptor warn under strict concurrency checking
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Immerse:
    type: application
    platform: macOS
    sources:
      - Immerse
    info:
      path: Immerse/Resources/Info.plist
      properties:
        # The .app file name and Info.plist name stay "Immerse"; the localized name 「沉浸日程」 comes from *.lproj/InfoPlist.strings
        CFBundleDisplayName: Immerse
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 debugzhao"
    entitlements:
      path: Immerse/Resources/Immerse.entitlements
      properties:
        # Needs to call /usr/bin/shortcuts to toggle Do Not Disturb, so the sandbox can't be enabled
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse
        PRODUCT_NAME: Immerse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # The test bundle is injected into the host app; disable Hardened Runtime in Debug to avoid library validation blocking it
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  ImmerseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ImmerseTests
    dependencies:
      - target: Immerse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse.tests

schemes:
  Immerse:
    build:
      targets:
        Immerse: all
        ImmerseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImmerseTests
