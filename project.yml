name: Immerse
options:
  bundleIdPrefix: com.debugzhao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # SE-0418：KeyPath 字面量自动推断为 Sendable，否则 SwiftData 的 #Predicate / SortDescriptor 在严格并发检查下会报警告
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Immerse:
    type: application
    platform: macOS
    sources:
      - Immerse
    info:
      path: Immerse/Resources/Info.plist
      properties:
        CFBundleDisplayName: Immerse
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 debugzhao"
    entitlements:
      path: Immerse/Resources/Immerse.entitlements
      properties:
        # 需要调用 /usr/bin/shortcuts 切换勿扰，不能开沙盒
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse
        PRODUCT_NAME: Immerse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # 测试 bundle 需要注入宿主 App，Debug 下关闭 Hardened Runtime 避免库校验拦截
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  ImmerseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ImmerseTests
    dependencies:
      - target: Immerse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.debugzhao.immerse.tests

schemes:
  Immerse:
    build:
      targets:
        Immerse: all
        ImmerseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImmerseTests
